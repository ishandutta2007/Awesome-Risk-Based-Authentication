<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#34d399;#38bdf8" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#34d399">
        <animate attributeName="stop-color" values="#34d399;#38bdf8;#c084fc;#34d399" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes pulseRing {
        0%, 100% { transform: scale(1); opacity: 0.35; }
        50% { transform: scale(1.08); opacity: 0.85; }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -36; }
      }
      @keyframes scanSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes laserMove {
        0% { transform: translateY(-45px); opacity: 0.2; }
        50% { transform: translateY(45px); opacity: 0.9; }
        100% { transform: translateY(-45px); opacity: 0.2; }
      }
      .floating-group {
        animation: floatSlow 5s ease-in-out infinite;
        transform-origin: center;
      }
      .pulsing-ring {
        animation: pulseRing 3.5s ease-in-out infinite;
        transform-origin: 180px 160px;
      }
      .circuit-line {
        stroke-dasharray: 6 5;
        animation: dashFlow 2.5s linear infinite;
      }
      .scanner-beam {
        animation: scanSweep 4s linear infinite;
        transform-origin: 180px 160px;
      }
      .laser-line {
        animation: laserMove 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Tech Grid Lines -->
  <g stroke="#334155" stroke-opacity="0.22" stroke-width="1">
    <line x1="0" y1="64" x2="1200" y2="64"/>
    <line x1="0" y1="128" x2="1200" y2="128"/>
    <line x1="0" y1="192" x2="1200" y2="192"/>
    <line x1="0" y1="256" x2="1200" y2="256"/>
    <line x1="120" y1="0" x2="120" y2="320"/>
    <line x1="240" y1="0" x2="240" y2="320"/>
    <line x1="360" y1="0" x2="360" y2="320"/>
    <line x1="480" y1="0" x2="480" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="720" y1="0" x2="720" y2="320"/>
    <line x1="840" y1="0" x2="840" y2="320"/>
    <line x1="960" y1="0" x2="960" y2="320"/>
    <line x1="1080" y1="0" x2="1080" y2="320"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="180" cy="160" r="140" fill="url(#pulseGlow)"/>
  <circle cx="980" cy="130" r="180" fill="url(#pulseGlow)" opacity="0.4"/>

  <!-- Circuit Network Lines -->
  <g fill="none" stroke="#0ea5e9" stroke-opacity="0.45" stroke-width="1.5">
    <path class="circuit-line" d="M 180 160 L 320 160 L 360 210 L 520 210"/>
    <path class="circuit-line" d="M 180 160 L 260 80 L 420 80 L 460 110"/>
    <path class="circuit-line" d="M 180 160 L 140 240 L 40 240"/>
    <path class="circuit-line" d="M 1020 80 L 940 80 L 890 140 L 780 140"/>
    <path class="circuit-line" d="M 1120 220 L 1020 220 L 980 180 L 850 180"/>
  </g>

  <!-- Node Dots -->
  <circle cx="320" cy="160" r="3.5" fill="#38bdf8"/>
  <circle cx="360" cy="210" r="3" fill="#818cf8"/>
  <circle cx="520" cy="210" r="4" fill="#34d399"/>
  <circle cx="260" cy="80" r="3.5" fill="#38bdf8"/>
  <circle cx="420" cy="80" r="3" fill="#c084fc"/>
  <circle cx="890" cy="140" r="3.5" fill="#38bdf8"/>
  <circle cx="980" cy="180" r="3" fill="#34d399"/>

  <!-- Left Emblem: Adaptive Risk Shield & Biometric Scanner -->
  <g class="floating-group">
    <circle class="pulsing-ring" cx="180" cy="160" r="76" fill="none" stroke="url(#cyberGlow)" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle cx="180" cy="160" r="64" fill="#0b1329" fill-opacity="0.9" stroke="#38bdf8" stroke-width="2" filter="url(#softGlow)"/>

    <!-- Radar lines -->
    <circle cx="180" cy="160" r="46" fill="none" stroke="#0284c7" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="180" cy="160" r="28" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>

    <!-- Rotating Scanner Beam -->
    <line class="scanner-beam" x1="180" y1="160" x2="236" y2="160" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

    <!-- Security Shield Icon -->
    <path d="M 180 116 L 214 130 C 214 162 195 186 180 194 C 165 186 146 162 146 130 Z" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#softGlow)"/>

    <!-- Fingerprint / Biometric Arcs inside Shield -->
    <path d="M 172 142 A 10 10 0 0 1 188 142" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <path d="M 167 152 A 16 16 0 0 1 193 152" fill="none" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round"/>
    <path d="M 163 162 A 22 22 0 0 1 197 162" fill="none" stroke="#bae6fd" stroke-width="2" stroke-linecap="round"/>
    <path d="M 170 172 A 14 14 0 0 1 190 172" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>

    <!-- Animated Laser Scanning Line -->
    <g transform="translate(0, 160)">
      <line class="laser-line" x1="150" y1="0" x2="210" y2="0" stroke="#34d399" stroke-width="2" filter="url(#softGlow)"/>
    </g>
  </g>

  <!-- Typography & Headers -->
  <g transform="translate(340, 0)">
    <!-- Category Badge -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="310" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="14" cy="14" r="5" fill="#10b981">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8" letter-spacing="1.5">ZERO TRUST IDENTITY &amp; ADAPTIVE MFA</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="43" font-weight="900" fill="url(#cyberGlow)" filter="url(#softGlow)" letter-spacing="-0.5">
      Awesome Risk-Based Auth
    </text>

    <!-- Subtitle -->
    <text x="0" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
      Adaptive MFA • Continuous Authentication • Identity Threat Protection • Open-Source &amp; SaaS
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 204)">
      <rect x="0" y="0" width="125" height="26" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1"/>
      <text x="62" y="17" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#38bdf8" text-anchor="middle">🛡️ Adaptive MFA</text>

      <rect x="135" y="0" width="140" height="26" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1"/>
      <text x="205" y="17" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#a855f7" text-anchor="middle">⚡ Continuous Auth</text>

      <rect x="285" y="0" width="135" height="26" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1"/>
      <text x="352" y="17" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#34d399" text-anchor="middle">🔍 Threat Signals</text>

      <rect x="430" y="0" width="130" height="26" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1"/>
      <text x="495" y="17" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#38bdf8" text-anchor="middle">📱 Device Trust</text>

      <rect x="570" y="0" width="145" height="26" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1"/>
      <text x="642" y="17" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#f59e0b" text-anchor="middle">🌐 Zero Trust Arch</text>
    </g>

    <!-- Stats Bar -->
    <g transform="translate(0, 258)" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="500">
      <text x="0" y="14">🔥 35+ Curated Open-Source Stacks</text>
      <text x="235" y="14">•</text>
      <text x="250" y="14">💼 15 Commercial SaaS Platforms</text>
      <text x="475" y="14">•</text>
      <text x="490" y="14">🏆 Live Stars &amp; Verified Pricing</text>
    </g>
  </g>

  <!-- Decorative Corner Accents -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 12 36 V 12 H 36"/>
    <path d="M 1188 36 V 12 H 1164"/>
    <path d="M 12 284 V 308 H 36"/>
    <path d="M 1188 284 V 308 H 1164"/>
  </g>
</svg>